[package]
name = "quicksample"
version = "0.1.0"
edition = "2021"
description = "Quick audio sampler: record via PulseAudio, trim a region in the waveform, save as WAV"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
hound = "3.5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
tokio = { version = "1", features = ["time"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
